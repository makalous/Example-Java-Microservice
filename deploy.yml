- hosts: rhel
  tasks:
    - name: Stop old app
      command: pkill -f app-0.1.jar
      register: stop
      failed_when: stop.rc > 1        # 1 = nic do zabicia, to nie błąd

    - name: Wait for port to free up
      wait_for:
        port: 9043
        state: stopped
        timeout: 30

    - name: Create app directory
      file:
        path: /home/tester/app
        state: directory

    - name: Copy jar to VM
      copy:
        src: "{{ playbook_dir }}/build/libs/app-0.1.jar"
        dest: /home/tester/app/app-0.1.jar

    - name: Run new app
      shell: nohup java -Xms64m -Xmx128m -jar app-0.1.jar > app.log 2>&1 < /dev/null &
      args:
        chdir: /home/tester/app
      async: 10
      poll: 0

    - name: Wait for app to start
      wait_for:
        port: 9043
        timeout: 60